name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Verify design team in sync with roster
        run: |
          if ! pnpm design-team:check; then
            echo "::error::Generated design-team outputs are out of date."
            echo "::error::Edit design-team/roster.md, then run"
            echo "::error::  pnpm design-team"
            echo "::error::and commit .claude/agents/, design-team/dist/ and .crystl/heroes/."
            exit 1
          fi

      - name: Verify decision log
        run: |
          if ! pnpm decisions:check; then
            echo "::error::decisions/ failed validation."
            echo "::error::Every entry needs the frontmatter fields, the four body"
            echo "::error::sections, and a row in decisions/README.md."
            echo "::error::Template and rules: decisions/README.md"
            exit 1
          fi

      - name: Verify icon registry in sync with config
        env:
          FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
        run: |
          pnpm --filter @auxiliary/icons sync
          if ! git diff --exit-code packages/icons/src/registry.ts; then
            echo "::error::packages/icons/src/registry.ts is out of date."
            echo "::error::Edit packages/icons/src/config.ts (or inputs/*.svg), then run"
            echo "::error::  pnpm --filter @auxiliary/icons sync"
            echo "::error::and commit the result."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Pack smoke test (publish correctness)
        run: pnpm pack:smoke

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
        run: pnpm install --frozen-lockfile

      # Its own job, not a step in `build`: this one needs a browser binary and
      # its own build of the docs site. Folding it into `pnpm test` would put a
      # ~95 MB download and a vitepress build in front of every local test loop.
      - name: Install Playwright browser
        run: pnpm --filter @auxiliary/docs exec playwright install --with-deps chromium

      - name: Build packages
        run: pnpm build

      - name: Visual regression
        run: |
          if ! pnpm --filter @auxiliary/docs test:visual; then
            echo "::error::Committed screenshots no longer match what the components render."
            echo "::error::If the change is intended, regenerate and commit:"
            echo "::error::  pnpm --filter @auxiliary/docs test:visual:update"
            echo "::error::Otherwise download the 'visual-diff' artifact to see the diff."
            exit 1
          fi

      - name: Upload diff on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            apps/docs/test-results/
            apps/docs/playwright-report/
          retention-days: 7

  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Verify changeset present
        run: pnpm changeset status --since=origin/main
